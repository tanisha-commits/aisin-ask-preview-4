<section class="gn" id="global-network" aria-labelledby="gn-title" data-gn>
      <header class="gn-head">
        <h2 id="gn-title"><span class="gn-t1">AISIN Group,</span> <span class="gn-t2">around the world</span></h2>
        <dl class="gn-stats" aria-label="AISIN Group network at a glance">
          <div><dt>Group companies</dt><dd data-gn-stat="companies">186</dd></div>
          <div><dt>Global locations</dt><dd data-gn-stat="locations">120</dd></div>
          <div><dt>Countries</dt><dd data-gn-stat="countries">23</dd></div>
        </dl>
      </header>

      <div class="gn-body">
        <div class="gn-stage">
          <div class="gn-map" data-gn-map>
            <svg class="gn-svg" viewBox="0 0 1000 394.4" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World map of AISIN Group locations" data-gn-svg>
              <path class="gn-land" data-gn-land d=""></path>
              <path class="gn-dots" data-gn-dots d=""></path>
              <g class="gn-pins" data-gn-pins></g>
            </svg>
            <div class="gn-popup" data-gn-popup role="dialog" aria-modal="false" aria-labelledby="gn-popup-title" hidden>
              <button type="button" class="gn-popup-close" data-gn-popup-close aria-label="Close company details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
              <div data-gn-popup-body></div>
            </div>
            <div class="gn-controls" role="group" aria-label="Map zoom">
              <button type="button" data-gn-zoom="in" aria-label="Zoom in"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
              <button type="button" data-gn-zoom="out" aria-label="Zoom out"><i class="fa-solid fa-minus" aria-hidden="true"></i></button>
              <button type="button" data-gn-zoom="reset" aria-label="Show whole world"><i class="fa-solid fa-earth-asia" aria-hidden="true"></i></button>
            </div>
          </div>
          <p class="gn-source">Source: <a href="https://www.aisin.com/en/profile/global/" target="_blank" rel="noopener">AISIN Corporation, Global Network</a> (October 2026). Markers placed at city level.</p>
        </div>
      </div>
    </section>
